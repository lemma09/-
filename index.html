<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEMMA ASEFA KEBEDE - Portfolio</title>
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Dual Background Overlay system */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: opacity 1s ease-in-out;
            z-index: -2;
        }

        .bg1 {
            background-image: url('bg1.jpg');
            opacity: 1;
        }

        .bg2 {
            background-image: url('bg2.jpg');
            opacity: 0;
        }

        /* Dark tint to keep content legible while background stays visible */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        /* Background Switcher Button */
        .bg-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(10, 15, 30, 0.75);
            border: 1px solid #00d2ff;
            color: #00d2ff;
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            z-index: 10;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        .bg-btn:hover {
            background: #00d2ff;
            color: #000;
            box-shadow: 0 0 15px #00d2ff;
        }

        /* Glassmorphism Container (More transparent so background shines) */
        .container {
            background: rgba(10, 15, 30, 0.65);
            backdrop-filter: blur(10px);
            padding: 35px 25px;
            border-radius: 24px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 210, 255, 0.3);
            border: 1px solid rgba(0, 210, 255, 0.35);
        }

        /* Profile Picture */
        .profile-img {
            width: 145px;
            height: 145px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #00d2ff;
            box-shadow: 0 0 22px rgba(0, 210, 255, 0.6);
            margin-bottom: 18px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 22px;
            text-transform: uppercase;
            color: #ffffff;
        }

        /* Professional Expertise Cards */
        .roles-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .role-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 210, 255, 0.35);
            padding: 12px 8px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .role-card:hover {
            background: rgba(0, 210, 255, 0.25);
            border-color: #00d2ff;
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
        }

        .role-card i {
            font-size: 22px;
            color: #00d2ff;
        }

        .role-card span {
            font-size: 11px;
            font-weight: 600;
            color: #ffffff;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 18px 0;
        }

        /* Circular Social Media Icons */
        .social-icons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .social-icons a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            color: #ffffff;
            font-size: 17px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icons a:hover {
            background: #00d2ff;
            color: #000;
            box-shadow: 0 0 15px #00d2ff;
            transform: translateY(-3px);
        }

        @media (max-width: 480px) {
            .bg-btn {
                top: 10px;
                right: 10px;
                padding: 8px 12px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <!-- Background Images -->
    <div class="bg-layer bg1" id="bg1"></div>
    <div class="bg-layer bg2" id="bg2"></div>
    <div class="overlay"></div>

    <!-- Toggle Button to Switch Backgrounds -->
    <button class="bg-btn" onclick="switchBackground()">
        <i class="fas fa-image"></i> Background Jijjiiri
    </button>

    <div class="container">
        <!-- Profile Picture -->
        <img src="Profile.jpg" alt="LEMMA ASEFA KEBEDE" class="profile-img">
        
        <!-- Name -->
        <h1>LEMMA ASEFA KEBEDE</h1>

        <!-- World-Known Expertise Icons -->
        <div class="roles-grid">
            <div class="role-card">
                <i class="fas fa-bullhorn"></i>
                <span>Digital Marketer</span>
            </div>
            <div class="role-card">
                <i class="fas fa-photo-film"></i>
                <span>Video Editor</span>
            </div>
            <div class="role-card">
                <i class="fas fa-video"></i>
                <span>Cinematographer</span>
            </div>
            <div class="role-card">
                <i class="fas fa-palette"></i>
                <span>Graphic Designer</span>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Social Media Links -->
        <div class="social-icons">
            <a href="https://www.linkedin.com/in/lemma-asefa-b9814842a?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            <a href="mailto:asefalemma.official@gmail.com" target="_blank" title="Email"><i class="fas fa-envelope"></i></a>
            <a href="https://wa.me/251909506573" target="_blank" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
            <a href="https://www.instagram.com/qaroodigital_agency?stkn=MXB6dHB6czhucGJuNQ==" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://www.facebook.com/share/1DpVcsq5rq/" target="_blank" title="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="https://www.tiktok.com/@lemma.official5?_r=1&_t=ZS-99lKBBG9gcX" target="_blank" title="TikTok"><i class="fab fa-tiktok"></i></a>
            <a href="https://www.snapchat.com/add/qaroodigital?share_id=29tkCyabXXU&locale=en-GB" target="_blank" title="Snapchat"><i class="fab fa-snapchat-ghost"></i></a>
            <a href="https://www.youtube.com/@lemmaasefa-09" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
            <a href="https://pin.it/2qiOYLAdX" target="_blank" title="Pinterest"><i class="fab fa-pinterest-p"></i></a>
        </div>
    </div>

    <script>
        let currentBg = 1;

        function switchBackground() {
            const bg1 = document.getElementById('bg1');
            const bg2 = document.getElementById('bg2');

            if (currentBg === 1) {
                bg1.style.opacity = '0';
                bg2.style.opacity = '1';
                currentBg = 2;
            } else {
                bg1.style.opacity = '1';
                bg2.style.opacity = '0';
                currentBg = 1;
            }
        }

        // Auto change background every 8 seconds
        setInterval(switchBackground, 8000);
    </script>

</body>
</html>
