<!DOCTYPE html>

    <!-- FontAwesome 6 for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Updated background image */
            background-image: url('2 backgrond_2.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            padding: 20px;
        }

        /* Glassmorphism main card */
        .container {
            background: rgba(10, 15, 30, 0.75);
            backdrop-filter: blur(12px);
            padding: 40px 25px;
            border-radius: 24px;
            text-align: center;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 210, 255, 0.25);
            border: 1px solid rgba(0, 210, 255, 0.25);
        }

        /* Circular Profile Image */
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #00d2ff;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
            margin-bottom: 18px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-transform: uppercase;
            color: #ffffff;
        }

        p.agency {
            font-size: 15px;
            color: #00d2ff;
            font-weight: 600;
            margin-bottom: 22px;
            letter-spacing: 1px;
        }

        /* Professional Expertise Icons Layout */
        .roles-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .role-badge {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 12px 8px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .role-badge:hover {
            background: rgba(0, 210, 255, 0.2);
            border-color: #00d2ff;
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        .role-badge i {
            font-size: 22px;
            color: #00d2ff;
        }

        .role-badge span {
            font-size: 12px;
            font-weight: 600;
            color: #e0f7fa;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
            margin: 20px 0;
        }

        /* Social Icons */
        .social-icons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .social-icons a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: #ffffff;
            font-size: 18px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icons a:hover {
            background: #00d2ff;
            color: #000;
            box-shadow: 0 0 15px #00d2ff;
            transform: translateY(-4px);
        }

        /* Responsive design for Mobile, Laptop & Desktop */
        @media (max-width: 480px) {
            .container {
                padding: 30px 18px;
            }
            .profile-img {
                width: 125px;
                height: 125px;
            }
            h1 {
                font-size: 21px;
            }
            .roles-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .role-badge span {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
