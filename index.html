<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEMMA ASEFA KEBEDE - Portfolio</title>
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Background image set to background.jpg */
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #0b0f19; /* Fallback dark background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            padding: 20px;
        }

        /* Glassmorphism Container */
        .container {
            background: rgba(10, 15, 30, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 35px 25px;
            border-radius: 24px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 210, 255, 0.3);
            border: 1px solid rgba(0, 210, 255, 0.35);
        }

        /* Profile Picture */
        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
            margin-bottom: 18px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
            color: #ffffff;
        }

        /* Professional Expertise Badges */
        .roles-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .role-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 12px 8px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .role-card:hover {
            background: rgba(0, 210, 255, 0.25);
            border-color: #00d2ff;
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        .role-card i {
            font-size: 22px;
            color: #00d2ff;
        }

        .role-card span {
            font-size: 11px;
            font-weight: 600;
            color: #ffffff;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
            margin: 18px 0;
        }

        /* Social Media Icons */
        .social-icons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .social-icons a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: #ffffff;
            font-size: 17px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icons a:hover {
            background: #00d2ff;
            color: #000000;
            box-shadow: 0 0 15px #00d2ff;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Picture -->
        <img src="profile.jpg" alt="LEMMA ASEFA KEBEDE" class="profile-img">
        
        <!-- Name -->
        <h1>LEMMA ASEFA KEBEDE</h1>

        <!-- Expertise Badges with Icons -->
        <div class="roles-grid">
            <div class="role-card">
                <i class="fas fa-bullhorn"></i>
                <span>Digital Marketer</span>
            </div>
            <div class="role-card">
                <i class="fas fa-photo-film"></i>
                <span>Video Editor</span>
            </div>
            <div class="role-card">
                <i class="fas fa-video"></i>
                <span>Cinematographer</span>
            </div>
            <div class="role-card">
                <i class="fas fa-palette"></i>
                <span>Graphic Designer</span>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Social Links -->
        <div class="social-icons">
            <a href="https://www.linkedin.com/" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            <a href="https://github.com/" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
            <a href="https://facebook.com/" target="_blank" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="https://t.me/" target="_blank" aria-label="Telegram"><i class="fab fa-telegram-plane"></i></a>
            <a href="https://wa.me/" target="_blank" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
        </div>
    </div>

</body>
</html>
