    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Background Image */
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #080705;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            padding: 20px;
        }

        /* Premium Gold Glassmorphism Card Container */
        .container {
            background: linear-gradient(145deg, rgba(25, 20, 8, 0.88), rgba(10, 8, 3, 0.94));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 35px 25px;
            border-radius: 24px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 35px rgba(212, 175, 55, 0.35), 0 0 15px rgba(255, 215, 0, 0.2);
            border: 1px solid rgba(212, 175, 55, 0.55);
        }

        /* Profile Picture with Golden Glow Border */
        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #D4AF37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.7);
            margin-bottom: 18px;
        }

        /* Gold Metallic Title Text */
        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #FFF5C0, #D4AF37, #AA771C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
        }

        /* Gold Expertise Badges Grid */
        .roles-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .role-card {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.35);
            padding: 12px 8px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .role-card:hover {
            background: rgba(212, 175, 55, 0.22);
            border-color: #FFD700;
            transform: translateY(-3px);
            box-shadow: 0 4px 18px rgba(212, 175, 55, 0.4);
        }

        .role-card i {
            font-size: 22px;
            color: #FFD700;
        }

        .role-card span {
            font-size: 11px;
            font-weight: 600;
            color: #F8F1E5;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.5), transparent);
            margin: 18px 0;
        }

        /* Gold Social Media Buttons */
        .social-icons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .social-icons a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50%;
            color: #FFD700;
            font-size: 17px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icons a:hover {
            background: linear-gradient(135deg, #FFD700, #D4AF37);
            color: #0f0a00;
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.8);
            transform: translateY(-3px);
        }
    </style>
</head>
